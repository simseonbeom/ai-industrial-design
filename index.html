<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

:root{--bg:#0D0D0F;--panel:#141417;--line:#26262A;--text:#EDEBE7;--gray:#8E8C88;--dim:#5E5D5A;--gold:#B9A488}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 'IBM Plex Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--gold)}

body{min-height:100vh;display:flex;flex-direction:column}
.hero{position:relative;min-height:62vh;display:flex;align-items:flex-end;padding:64px 8vw;background:#0B0B0D url(assets/img/cover.jpg) center/cover no-repeat}
.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,11,13,.92) 30%,rgba(11,11,13,.2))}
.hero>div{position:relative;max-width:720px}
.k{font:500 13px 'Instrument Sans';letter-spacing:4px;text-transform:uppercase;color:var(--gray)}
h1{font:500 clamp(44px,7vw,88px)/1.05 'Instrument Sans';letter-spacing:-2px;margin:12px 0}
.s{font:italic 400 clamp(22px,3vw,32px) 'Instrument Serif';color:var(--gray);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.card{background:var(--bg);padding:40px 8vw 48px 40px;text-decoration:none;color:var(--text);transition:background .15s}
.card:first-child{padding-left:8vw} .card:hover{background:var(--panel)}
.card b{display:block;font:500 13px 'Instrument Sans';letter-spacing:3px;color:var(--gold);margin-bottom:12px}
.card span{display:block;font:500 26px/1.3 'Instrument Sans','IBM Plex Sans KR'} .card small{display:block;color:var(--gray);margin-top:8px;font-size:14px}
footer{margin-top:auto;padding:24px 8vw;color:var(--dim);font:13px 'Instrument Sans'}
@media(max-width:700px){.card,.card:first-child{padding:32px 16px} .hero{padding:48px 16px}}
